[package]
name = "sentinel-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# SQLite (used by arti) compiled in: one self-contained binary on every
# system, nothing to install.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
arti-client.workspace = true
tor-guardmgr.workspace = true
tor-config.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
blake3.workspace = true
serde_json = "1"
sentinel-core.workspace = true
tor-rtcompat = "0.47"
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
futures.workspace = true
tokio-socks.workspace = true
data-encoding.workspace = true
