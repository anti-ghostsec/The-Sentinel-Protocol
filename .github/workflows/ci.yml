name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sentinel-proto
    steps:
      - uses: actions/checkout@v4
      # The app crate is Tauri, which links against WebKitGTK on Linux.
      - name: System libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Toolchain
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-proto
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
